<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentaLite Enterprise - HRIS & Attendance Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800" x-data="enterpriseApp()">

    <!-- App Container Wrapper (Mobile & Desktop Responsive Frame) -->
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col justify-between relative overflow-hidden border-x border-slate-200">
        
        <!-- ================= HALAMAN LOGIN KORPORAT ================= -->
        <template x-if="!isLoggedIn">
            <div class="p-8 flex-1 flex flex-col justify-center space-y-6 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900 text-white">
                <div class="text-center space-y-3">
                    <div class="w-16 h-16 bg-blue-600/30 rounded-2xl mx-auto flex items-center justify-center backdrop-blur-md text-2xl font-bold border border-blue-400/30 shadow-inner">
                        <i class="fa-solid fa-building-shield text-blue-400"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-extrabold tracking-tight">TalentaLite Enterprise</h1>
                        <p class="text-xs text-slate-400 mt-1">HRIS & Workforce Management System</p>
                    </div>
                </div>

                <div class="bg-white text-slate-800 p-6 rounded-3xl shadow-2xl space-y-4 border border-slate-100">
                    <div class="space-y-1">
                        <h2 class="text-sm font-bold text-slate-800">Autentikasi Karyawan</h2>
                        <p class="text-[11px] text-slate-400">Pilih profil kredensial demo untuk masuk</p>
                    </div>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">Akun Pengguna</label>
                            <select x-model="selectedRole" class="w-full border border-slate-200 p-3 rounded-xl focus:outline-blue-600 bg-slate-50 font-medium text-slate-700">
                                <option value="employee">Budi Santoso (Staff Operasional & CRM)</option>
                                <option value="admin">Sarah Manager (HR Operation Manager)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1 font-semibold">Keamanan Akses</label>
                            <input type="password" value="••••••••••••" disabled class="w-full border border-slate-200 p-3 rounded-xl bg-slate-100 text-slate-400 font-mono">
                        </div>
                    </div>

                    <button @click="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/20 transition text-xs tracking-wide">
                        MASUK KE SISTEM 🚀
                    </button>

                    <div class="text-center pt-2 border-t border-slate-100">
                        <p class="text-[10px] text-slate-400 font-medium">Secured with Enterprise Geofencing & Encryption</p>
                    </div>
                </div>
            </div>
        </template>

        <!-- ================= HALAMAN UTAMA APLIKASI ================= -->
        <template x-if="isLoggedIn">
            <div class="flex flex-col flex-1 justify-between bg-slate-50">
                
                <!-- HEADER KORPORAT -->
                <header class="bg-slate-900 text-white p-5 rounded-b-[2rem] shadow-xl border-b border-slate-800">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-blue-600 text-white font-bold text-sm flex items-center justify-center shadow-md border border-blue-400/30" x-text="currentUser.initial"></div>
                            <div>
                                <h1 class="text-sm font-bold tracking-tight" x-text="currentUser.name"></h1>
                                <p class="text-[11px] text-slate-400 font-medium" x-text="currentUser.role"></p>
                            </div>
                        </div>
                        <button @click="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2 rounded-xl transition font-medium border border-slate-700">
                            Keluar <i class="fa-solid fa-arrow-right-from-bracket ml-1"></i>
                        </button>
                    </div>
                    <div class="mt-4 flex items-center justify-between text-xs bg-slate-800/80 p-2.5 rounded-xl border border-slate-700/60 text-slate-300">
                        <span><i class="fa-solid fa-location-dot text-blue-400 mr-1"></i> <span x-text="locationStatus"></span></span>
                        <span><i class="fa-regular fa-calendar text-blue-400 mr-1"></i> <span x-text="currentDate"></span></span>
                    </div>
                </header>

                <!-- KONTEN UTAMA BERDASARKAN TAB -->
                <main class="p-5 flex-1 overflow-y-auto pb-24 space-y-4">

                    <!-- TAB 1: BERANDA -->
                    <div x-show="activeTab === 'home'" class="space-y-4" x-cloak>
                        
                        <!-- VIEW KARYAWAN -->
                        <template x-if="currentUser.type === 'employee'">
                            <div class="space-y-4">
                                <!-- Status Kehadiran Card -->
                                <div class="bg-white border border-slate-200/80 p-5 rounded-2xl shadow-sm text-center relative overflow-hidden">
                                    <div class="absolute top-0 right-0 bg-blue-50 text-blue-700 text-[10px] font-bold px-3 py-1 rounded-bl-xl border-l border-b border-blue-100">
                                        Shift: Reguler (08:00 - 17:00)
                                    </div>
                                    
                                    <p class="text-xs text-slate-400 font-bold tracking-wider uppercase mt-1">Status Kehadiran Hari Ini</p>
                                    
                                    <div class="my-3">
                                        <span class="text-lg font-extrabold" :class="isClockedIn ? 'text-emerald-600' : 'text-amber-600'" x-text="attendanceStatus"></span>
                                    </div>

                                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200/60">
                                        <div>
                                            <p class="text-slate-400 font-medium">Clock-In</p>
                                            <p class="font-bold text-slate-800 text-sm" x-text="clockInTime || '--:--'"></p>
                                        </div>
                                        <div>
                                            <p class="text-slate-400 font-medium">Clock-Out</p>
                                            <p class="font-bold text-slate-800 text-sm" x-text="clockOutTime || '--:--'"></p>
                                        </div>
                                    </div>

                                    <template x-if="!isClockedIn">
                                        <button @click="clockIn()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2 text-xs">
                                            <i class="fa-solid fa-camera"></i> Clock-In (GPS & Selfie Valid)
                                        </button>
                                    </template>
                                    <template x-if="isClockedIn && !isClockedOut">
                                        <button @click="clockOut()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md shadow-rose-600/20 transition flex items-center justify-center gap-2 text-xs">
                                            <i class="fa-solid fa-person-walking-arrow-right"></i> Clock-Out Pulang Kantor
                                        </button>
                                    </template>
                                    <template x-if="isClockedIn && isClockedOut">
                                        <p class="text-xs text-blue-700 font-semibold bg-blue-50 py-2.5 rounded-lg border border-blue-100">✨ Kehadiran & Jam Kerja Selesai Terekam.</p>
                                    </template>
                                </div>

                                <!-- Modul Layanan Mandiri HRIS -->
                                <div>
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Layanan Mandiri Karyawan</h3>
                                    <div class="grid grid-cols-2 gap-2">
                                        <button @click="openModal('cuti')" class="p-3 bg-white border border-slate-200 hover:border-blue-600 rounded-xl text-left shadow-sm transition group">
                                            <i class="fa-solid fa-calendar-days text-blue-600 mb-1.5 text-sm group-hover:scale-110 transition-transform"></i>
                                            <p class="font-bold text-xs text-slate-800">Pengajuan Cuti</p>
                                            <p class="text-[10px] text-slate-400">Sisa kuota: 10 Hari</p>
                                        </button>
                                        <button @click="openModal('sakit')" class="p-3 bg-white border border-slate-200 hover:border-blue-600 rounded-xl text-left shadow-sm transition group">
                                            <i class="fa-solid fa-notes-medical text-rose-600 mb-1.5 text-sm group-hover:scale-110 transition-transform"></i>
                                            <p class="font-bold text-xs text-slate-800">Izin Sakit</p>
                                            <p class="text-[10px] text-slate-400">Lampirkan Surat Dokter</p>
                                        </button>
                                        <button @click="openModal('lembur')" class="p-3 bg-white border border-slate-200 hover:border-blue-600 rounded-xl text-left shadow-sm transition group">
                                            <i class="fa-solid fa-business-time text-amber-600 mb-1.5 text-sm group-hover:scale-110 transition-transform"></i>
                                            <p class="font-bold text-xs text-slate-800">Lembur (Overtime)</p>
                                            <p class="text-[10px] text-slate-400">Kalkulasi otomatis</p>
                                        </button>
                                        <button @click="openModal('koreksi')" class="p-3 bg-white border border-slate-200 hover:border-blue-600 rounded-xl text-left shadow-sm transition group">
                                            <i class="fa-solid fa-clock-rotate-left text-indigo-600 mb-1.5 text-sm group-hover:scale-110 transition-transform"></i>
                                            <p class="font-bold text-xs text-slate-800">Koreksi Absen</p>
                                            <p class="text-[10px] text-slate-400">Koreksi log harian</p>
                                        </button>
                                    </div>
                                </div>

                                <!-- Pengumuman Korporat -->
                                <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm space-y-2">
                                    <div class="flex items-center justify-between">
                                        <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Pengumuman Korporat</h4>
                                        <span class="text-[10px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-bold border border-blue-100">Resmi HR</span>
                                    </div>
                                    <div class="border-l-2 border-blue-600 pl-3 py-1 space-y-0.5">
                                        <p class="text-xs font-bold text-slate-800">Pemberlakuan Kebijakan Geofencing Baru</p>
                                        <p class="text-[11px] text-slate-500">Pembaruan sistem presensi berlaku efektif mulai Senin mendatang di seluruh unit.</p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- VIEW ADMIN / HR DASHBOARD -->
                        <template x-if="currentUser.type === 'admin'">
                            <div class="space-y-4">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Dashboard Analitik HR</h3>
                                    <span class="text-xs bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-lg font-bold border border-emerald-200">Sistem Aktif</span>
                                </div>

                                <div class="grid grid-cols-3 gap-2 text-center">
                                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                        <p class="text-base font-extrabold text-blue-600" x-text="adminStats.hadir">0</p>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Hadir</p>
                                    </div>
                                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                        <p class="text-base font-extrabold text-amber-600" x-text="adminStats.izin">0</p>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Cuti/Izin</p>
                                    </div>
                                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                        <p class="text-base font-extrabold text-rose-600" x-text="adminStats.alpha">0</p>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Alpha</p>
                                    </div>
                                </div>

                                <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm space-y-3">
                                    <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Persetujuan Pending Karyawan</h4>
                                    <div class="space-y-2">
                                        <template x-for="req in leaveRequests" :key="req.id">
                                            <div class="bg-slate-50 border border-slate-200/60 p-3 rounded-xl text-xs flex justify-between items-center">
                                                <div class="space-y-0.5">
                                                    <p class="font-bold text-slate-800" x-text="req.name"></p>
                                                    <p class="text-slate-500 text-[11px]" x-text="req.type + ' (' + req.date + ')'"></p>
                                                    <p class="text-slate-400 italic text-[10px]" x-text="'Catatan: ' + req.reason"></p>
                                                </div>
                                                <div>
                                                    <template x-if="req.status === 'Pending'">
                                                        <div class="flex gap-1">
                                                            <button @click="approveReq(req.id)" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold shadow-sm">Setujui</button>
                                                            <button @click="rejectReq(req.id)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1.5 rounded-lg text-[10px] font-bold">Tolak</button>
                                                        </div>
                                                    </template>
                                                    <template x-if="req.status !== 'Pending'">
                                                        <span class="px-2.5 py-1 rounded-md text-[10px] font-bold" :class="req.status === 'Disetujui' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'" x-text="req.status"></span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- TAB 2: TIM (DIREKTORI) -->
                    <div x-show="activeTab === 'team'" class="space-y-3" x-cloak>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Direktori Karyawan Korporat</h3>
                        <div class="space-y-2">
                            <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm text-xs">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center">SR</div>
                                    <div>
                                        <p class="font-bold text-slate-800">Siti Rahma</p>
                                        <p class="text-slate-400 text-[11px]">Marketing & Broadcast</p>
                                    </div>
                                </div>
                                <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-md font-bold text-[10px]">Hadir</span>
                            </div>
                            <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm text-xs">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center">AP</div>
                                    <div>
                                        <p class="font-bold text-slate-800">Andi Pratama</p>
                                        <p class="text-slate-400 text-[11px]">IT Support & Software</p>
                                    </div>
                                </div>
                                <span class="bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-md font-bold text-[10px]">Cuti</span>
                            </div>
                            <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm text-xs">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-slate-900 text-white font-bold flex items-center justify-center">BS</div>
                                    <div>
                                        <p class="font-bold text-slate-800">Budi Santoso</p>
                                        <p class="text-slate-400 text-[11px]">Staff Operasional & CRM</p>
                                    </div>
                                </div>
                                <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-md font-bold text-[10px]">Hadir</span>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 3: PAYROLL (SLIP GAJI) -->
                    <div x-show="activeTab === 'payroll'" class="space-y-4" x-cloak>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Slip Gaji & Kompensasi</h3>
                        <div class="bg-gradient-to-br from-slate-900 to-blue-950 text-white p-5 rounded-2xl shadow-lg space-y-3 border border-slate-800">
                            <p class="text-xs text-slate-300 font-medium">Estimasi Gaji Bersih (Take Home Pay)</p>
                            <h2 class="text-2xl font-extrabold tracking-tight">Rp 5.450.000</h2>
                            <div class="flex justify-between text-[11px] text-slate-300 pt-2 border-t border-slate-800">
                                <span>Periode: Oktober 2026</span>
                                <span class="text-emerald-400 font-bold">● Terverifikasi HR</span>
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm space-y-3 text-xs">
                            <h4 class="font-bold text-slate-700">Riwayat Slip Gaji</h4>
                            <div class="space-y-2">
                                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-200/60">
                                    <div>
                                        <p class="font-bold text-slate-800">September 2026</p>
                                        <p class="text-slate-400 text-[10px]">Dibayarkan (28 Sep 2026)</p>
                                    </div>
                                    <button @click="alert('Mengunduh dokumen PDF Slip Gaji resmi...')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold px-3 py-1.5 rounded-lg text-[11px] border border-blue-200 transition">Unduh PDF</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 4: AKUN / PROFIL -->
                    <div x-show="activeTab === 'account'" class="space-y-4" x-cloak>
                        <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm text-center space-y-3">
                            <div class="w-16 h-16 rounded-full bg-slate-900 text-white font-extrabold text-xl flex items-center justify-center mx-auto shadow-md border border-slate-700" x-text="currentUser.initial"></div>
                            <div>
                                <h3 class="font-bold text-slate-800 text-base" x-text="currentUser.name"></h3>
                                <p class="text-xs text-slate-400" x-text="currentUser.role"></p>
                            </div>
                            <span class="inline-block bg-blue-50 text-blue-700 border border-blue-200 text-[10px] font-bold px-3 py-1 rounded-full">Karyawan Tetap (Full-Time)</span>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden text-xs divide-y divide-slate-100">
                            <div class="p-3.5 flex justify-between items-center hover:bg-slate-50 cursor-pointer transition" @click="alert('Navigasi Pengaturan Keamanan Kata Sandi.')">
                                <span class="font-semibold text-slate-700"><i class="fa-solid fa-lock text-blue-600 w-5"></i> Keamanan Kata Sandi</span>
                                <i class="fa-solid fa-chevron-right text-slate-300"></i>
                            </div>
                            <div class="p-3.5 flex justify-between items-center hover:bg-slate-50 cursor-pointer transition" @click="alert('Pengaturan Notifikasi Perangkat.')">
                                <span class="font-semibold text-slate-700"><i class="fa-solid fa-bell text-blue-600 w-5"></i> Notifikasi Sistem</span>
                                <i class="fa-solid fa-chevron-right text-slate-300"></i>
                            </div>
                        </div>

                        <button @click="logout()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-3 rounded-2xl text-xs transition border border-rose-200 shadow-sm">
                            Keluar dari Sesi <i class="fa-solid fa-arrow-right-from-bracket ml-1"></i>
                        </button>
                    </div>

                </main>

                <!-- NAVIGATION BAR KORPORAT -->
                <nav class="bg-white border-t border-slate-200 p-2 flex justify-around text-center text-xs text-slate-400 absolute bottom-0 w-full max-w-md shadow-lg">
                    <button @click="activeTab = 'home'" :class="activeTab === 'home' ? 'text-blue-600 font-bold' : 'hover:text-slate-600'" class="flex flex-col items-center gap-1 py-1 px-3 transition">
                        <i class="fa-solid fa-house text-sm"></i> Beranda
                    </button>
                    <button @click="activeTab = 'team'" :class="activeTab === 'team' ? 'text-blue-600 font-bold' : 'hover:text-slate-600'" class="flex flex-col items-center gap-1 py-1 px-3 transition">
                        <i class="fa-solid fa-users text-sm"></i> Tim
                    </button>
                    <button @click="activeTab = 'payroll'" :class="activeTab === 'payroll' ? 'text-blue-600 font-bold' : 'hover:text-slate-600'" class="flex flex-col items-center gap-1 py-1 px-3 transition">
                        <i class="fa-solid fa-wallet text-sm"></i> Payroll
                    </button>
                    <button @click="activeTab = 'account'" :class="activeTab === 'account' ? 'text-blue-600 font-bold' : 'hover:text-slate-600'" class="flex flex-col items-center gap-1 py-1 px-3 transition">
                        <i class="fa-solid fa-user-gear text-sm"></i> Akun
                    </button>
                </nav>

                <!-- MODAL FORM PENGAJUAN -->
                <div x-show="showModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
                    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4 border border-slate-100">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                            <h3 class="font-bold text-sm text-slate-800" x-text="'Formulir Pengajuan ' + modalType.toUpperCase()"></h3>
                            <button @click="showModal = false" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                        </div>
                        
                        <div class="space-y-3 text-xs">
                            <div>
                                <label class="block text-slate-600 mb-1 font-semibold">Tanggal Pelaksanaan</label>
                                <input type="date" x-model="formInput.date" class="w-full border border-slate-200 p-2.5 rounded-xl focus:outline-blue-600 bg-slate-50 font-medium">
                            </div>
                            <div>
                                <label class="block text-slate-600 mb-1 font-semibold">Keterangan / Alasan Resmi</label>
                                <textarea x-model="formInput.reason" rows="3" placeholder="Tuliskan keterangan secara rinci..." class="w-full border border-slate-200 p-2.5 rounded-xl focus:outline-blue-600 bg-slate-50 font-medium"></textarea>
                            </div>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button @click="showModal = false" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition">Batal</button>
                            <button @click="submitRequest()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition">Kirim Pengajuan</button>
                        </div>
                    </div>
                </div>

            </div>
        </template>

    </div>

    <!-- Script Logika Korporat -->
    <script>
        function enterpriseApp() {
            return {
                isLoggedIn: false,
                selectedRole: 'employee',
                activeTab: 'home',
                currentUser: { name: '', role: '', initial: '', type: 'employee' },
                currentDate: 'Minggu, 4 Okt 2026',
                locationStatus: 'Kantor Pusat (Geofencing Valid)',
                
                isClockedIn: false,
                isClockedOut: false,
                clockInTime: '',
                clockOutTime: '',
                attendanceStatus: 'Belum Melakukan Clock-In',

                showModal: false,
                modalType: 'cuti',
                formInput: { date: '', reason: '' },

                adminStats: { hadir: 42, izin: 3, alpha: 0 },
                leaveRequests: [
                    { id: 1, name: 'Siti Rahma', type: 'Cuti Tahunan', date: '6-8 Okt 2026', reason: 'Urusan keluarga mendadak', status: 'Pending' },
                    { id: 2, name: 'Andi Pratama', type: 'Izin Sakit', date: '4 Okt 2026', reason: 'Demam tinggi & surat dokter terlampir', status: 'Pending' }
                ],

                login() {
                    this.isLoggedIn = true;
                    this.activeTab = 'home';
                    if (this.selectedRole === 'employee') {
                        this.currentUser = { name: 'Budi Santoso', role: 'Staff Operasional & CRM', initial: 'BS', type: 'employee' };
                    } else {
                        this.currentUser = { name: 'Sarah Manager', role: 'HR Operation Manager', initial: 'SM', type: 'admin' };
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                },

                clockIn() {
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.clockInTime = timeNow + ' WIB';
                    this.isClockedIn = true;
                    this.attendanceStatus = 'Hadir (Tepat Waktu)';
                    alert('📸 Verifikasi Enterprise: Swafoto & Lokasi GPS kantor berhasil divalidasi sistem.');
                },

                clockOut() {
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.clockOutTime = timeNow + ' WIB';
                    this.isClockedOut = true;
                    this.attendanceStatus = 'Selesai Jam Kerja Harian';
                    alert('✅ Clock-Out Berhasil: Rekapitulasi jam kerja & lembur otomatis tersimpan.');
                },

                openModal(type) {
                    this.modalType = type;
                    this.formInput.date = '';
                    this.formInput.reason = '';
                    this.showModal = true;
                },

                submitRequest() {
                    if(!this.formInput.date || !this.formInput.reason) {
                        alert('Mohon lengkapi seluruh formulir pengajuan.');
                        return;
                    }
                    
                    this.leaveRequests.unshift({
                        id: Date.now(),
                        name: this.currentUser.name,
                        type: this.modalType.toUpperCase(),
                        date: this.formInput.date,
                        reason: this.formInput.reason,
                        status: 'Pending'
                    });

                    this.adminStats.izin += 1;
                    this.showModal = false;
                    alert('🎉 Pengajuan berhasil dikirim ke sistem Approval HR.');
                },

                approveReq(id) {
                    const req = this.leaveRequests.find(r => r.id === id);
                    if(req) req.status = 'Disetujui';
                },

                rejectReq(id) {
                    const req = this.leaveRequests.find(r => r.id === id);
                    if(req) req.status = 'Ditolak';
                }
            }
        }
    </script>
</body>
</html>
