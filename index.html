<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentaLite Enterprise - HRIS & Attendance System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800" x-data="enterpriseApp()">

    <!-- App Container -->
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col justify-between relative overflow-hidden border-x border-slate-100">
        
        <!-- ================= HALAMAN LOGIN ================= -->
        <template x-if="!isLoggedIn">
            <div class="p-6 flex-1 flex flex-col justify-center space-y-6 bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 text-white">
                <div class="text-center space-y-2">
                    <div class="w-16 h-16 bg-white/10 rounded-2xl mx-auto flex items-center justify-center backdrop-blur-md text-2xl font-bold border border-white/20">
                        ⚡
                    </div>
                    <h1 class="text-2xl font-extrabold tracking-tight">TalentaLite Enterprise</h1>
                    <p class="text-xs text-blue-200">Full-Featured HRIS & Attendance System</p>
                </div>

                <div class="bg-white text-slate-800 p-6 rounded-3xl shadow-2xl space-y-4">
                    <h2 class="text-sm font-bold text-slate-700 text-center">Masuk ke Portal Perusahaan</h2>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-slate-500 mb-1 font-medium">Pilih Akses Pengguna</label>
                            <select x-model="selectedRole" class="w-full border border-slate-200 p-3 rounded-xl focus:outline-blue-600 bg-slate-50 font-medium">
                                <option value="employee">Karyawan (Budi Santoso - Operasional)</option>
                                <option value="admin">HR Admin (Sarah - HR Manager)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-500 mb-1 font-medium">Kata Sandi</label>
                            <input type="password" value="••••••••" disabled class="w-full border border-slate-200 p-3 rounded-xl bg-slate-100 text-slate-400">
                        </div>
                    </div>

                    <button @click="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition text-sm">
                        Masuk ke Sistem 🚀
                    </button>
                </div>
            </div>
        </template>

        <!-- ================= HALAMAN UTAMA APLIKASI ================= -->
        <template x-if="isLoggedIn">
            <div class="flex flex-col flex-1 justify-between bg-slate-50">
                
                <!-- HEADER ENTERPRISE -->
                <header class="bg-blue-600 text-white p-5 rounded-b-[2rem] shadow-lg">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center font-bold text-sm border border-white/30" x-text="currentUser.initial"></div>
                            <div>
                                <h1 class="text-base font-bold" x-text="currentUser.name"></h1>
                                <p class="text-[11px] text-blue-100" x-text="currentUser.role"></p>
                            </div>
                        </div>
                        <button @click="logout()" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-xl transition font-medium border border-blue-500">
                            Keluar 🚪
                        </button>
                    </div>
                    <div class="mt-4 flex items-center justify-between text-xs bg-blue-700/60 p-2.5 rounded-xl backdrop-blur-md border border-blue-500/30">
                        <span>📍 <span x-text="locationStatus"></span></span>
                        <span>📅 <span x-text="currentDate"></span></span>
                    </div>
                </header>

                <!-- KONTEN UTAMA BERDASARKAN TAB -->
                <main class="p-5 flex-1 overflow-y-auto pb-24 space-y-4">

                    <!-- TAB 1: BERANDA -->
                    <div x-show="activeTab === 'home'" class="space-y-4">
                        
                        <!-- VIEW KARYAWAN -->
                        <template x-if="currentUser.type === 'employee'">
                            <div class="space-y-4">
                                <!-- Status Kehadiran & Shift -->
                                <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm text-center relative overflow-hidden">
                                    <div class="absolute top-0 right-0 bg-blue-50 text-blue-600 text-[10px] font-bold px-3 py-1 rounded-bl-xl">
                                        Shift: Pagi (08:00 - 17:00)
                                    </div>
                                    
                                    <p class="text-xs text-slate-400 font-semibold tracking-wider uppercase mt-1">Status Kehadiran Hari Ini</p>
                                    
                                    <div class="my-3">
                                        <span class="text-xl font-extrabold" :class="isClockedIn ? 'text-emerald-600' : 'text-amber-600'" x-text="attendanceStatus"></span>
                                    </div>

                                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                        <div>
                                            <p class="text-slate-400">Clock-In</p>
                                            <p class="font-bold text-slate-800 text-sm" x-text="clockInTime || '--:--'"></p>
                                        </div>
                                        <div>
                                            <p class="text-slate-400">Clock-Out</p>
                                            <p class="font-bold text-slate-800 text-sm" x-text="clockOutTime || '--:--'"></p>
                                        </div>
                                    </div>

                                    <template x-if="!isClockedIn">
                                        <button @click="clockIn()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2 text-xs">
                                            <i class="fa-solid fa-camera"></i> Clock-In (GPS & Selfie Valid)
                                        </button>
                                    </template>
                                    <template x-if="isClockedIn && !isClockedOut">
                                        <button @click="clockOut()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md shadow-rose-600/20 transition flex items-center justify-center gap-2 text-xs">
                                            <i class="fa-solid fa-person-walking-arrow-right"></i> Clock-Out Pulang Kantor
                                        </button>
                                    </template>
                                    <template x-if="isClockedIn && isClockedOut">
                                        <p class="text-xs text-blue-600 font-semibold bg-blue-50 py-2 rounded-lg">✨ Kehadiran & Lembur tercatat otomatis.</p>
                                    </template>
                                </div>

                                <!-- Modul Pengajuan HR Lengkap -->
                                <div>
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Layanan Mandiri HRIS</h3>
                                    <div class="grid grid-cols-2 gap-2">
                                        <button @click="openModal('cuti')" class="p-3 bg-white border border-slate-200 hover:border-blue-500 rounded-xl text-left shadow-sm transition">
                                            <i class="fa-solid fa-calendar-days text-blue-600 mb-1 text-sm"></i>
                                            <p class="font-bold text-xs text-slate-700">Pengajuan Cuti</p>
                                            <p class="text-[9px] text-slate-400">Sisa kuota: 10 Hari</p>
                                        </button>
                                        <button @click="openModal('sakit')" class="p-3 bg-white border border-slate-200 hover:border-blue-500 rounded-xl text-left shadow-sm transition">
                                            <i class="fa-solid fa-notes-medical text-rose-600 mb-1 text-sm"></i>
                                            <p class="font-bold text-xs text-slate-700">Izin Sakit</p>
                                            <p class="text-[9px] text-slate-400">Lampirkan Surat Dokter</p>
                                        </button>
                                        <button @click="openModal('lembur')" class="p-3 bg-white border border-slate-200 hover:border-blue-500 rounded-xl text-left shadow-sm transition">
                                            <i class="fa-solid fa-business-time text-amber-600 mb-1 text-sm"></i>
                                            <p class="font-bold text-xs text-slate-700">Lembur (Overtime)</p>
                                            <p class="text-[9px] text-slate-400">Kalkulasi otomatis</p>
                                        </button>
                                        <button @click="openModal('koreksi')" class="p-3 bg-white border border-slate-200 hover:border-blue-500 rounded-xl text-left shadow-sm transition">
                                            <i class="fa-solid fa-clock-rotate-left text-indigo-600 mb-1 text-sm"></i>
                                            <p class="font-bold text-xs text-slate-700">Koreksi Absen</p>
                                            <p class="text-[9px] text-slate-400">Lupa clock-in/out</p>
                                        </button>
                                    </div>
                                </div>

                                <!-- Pengumuman & Berita Perusahaan -->
                                <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm space-y-2">
                                    <div class="flex items-center justify-between">
                                        <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Pengumuman & Kegiatan HR</h4>
                                        <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-semibold">Resmi</span>
                                    </div>
                                    <div class="border-l-2 border-blue-600 pl-3 py-1 space-y-0.5">
                                        <p class="text-xs font-bold text-slate-800">Pembaruan Kebijakan Jam Kerja Q4</p>
                                        <p class="text-[11px] text-slate-500">Pemberlakuan aturan geofencing GPS terbaru di seluruh cabang.</p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- VIEW ADMIN / HR DASHBOARD -->
                        <template x-if="currentUser.type === 'admin'">
                            <div class="space-y-4">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Enterprise Analytics & Approval</h3>
                                    <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">Live System</span>
                                </div>

                                <div class="grid grid-cols-3 gap-2 text-center">
                                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                                        <p class="text-base font-extrabold text-blue-700" x-text="adminStats.hadir">0</p>
                                        <p class="text-[10px] text-blue-500 font-bold">Hadir</p>
                                    </div>
                                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-100">
                                        <p class="text-base font-extrabold text-amber-700" x-text="adminStats.izin">0</p>
                                        <p class="text-[10px] text-amber-500 font-bold">Cuti / Izin</p>
                                    </div>
                                    <div class="bg-rose-50 p-3 rounded-xl border border-rose-100">
                                        <p class="text-base font-extrabold text-rose-700" x-text="adminStats.alpha">0</p>
                                        <p class="text-[10px] text-rose-500 font-bold">Alpha</p>
                                    </div>
                                </div>

                                <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm space-y-3">
                                    <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Antrean Persetujuan Terpadu</h4>
                                    <div class="space-y-2">
                                        <template x-for="req in leaveRequests" :key="req.id">
                                            <div class="bg-slate-50 border border-slate-100 p-3 rounded-xl text-xs flex justify-between items-center">
                                                <div class="space-y-0.5">
                                                    <p class="font-bold text-slate-800" x-text="req.name"></p>
                                                    <p class="text-slate-500 text-[11px]" x-text="req.type + ' (' + req.date + ')'"></p>
                                                    <p class="text-slate-400 italic text-[10px]" x-text="'Catatan: ' + req.reason"></p>
                                                </div>
                                                <div>
                                                    <template x-if="req.status === 'Pending'">
                                                        <div class="flex gap-1">
                                                            <button @click="approveReq(req.id)" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1.5 rounded-lg text-[10px] font-bold">Setujui</button>
                                                            <button @click="rejectReq(req.id)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1.5 rounded-lg text-[10px] font-bold">Tolak</button>
                                                        </div>
                                                    </template>
                                                    <template x-if="req.status !== 'Pending'">
                                                        <span class="px-2 py-1 rounded-md text-[10px] font-bold" :class="req.status === 'Disetujui' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'" x-text="req.status"></span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- TAB 2: TIM (DIREKTORI) -->
                    <div x-show="activeTab === 'team'" class="space-y-3" x-cloak>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Direktori Karyawan Perusahaan</h3>
                        <div class="space-y-2">
                            <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm text-xs">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center">SR</div>
                                    <div>
                                        <p class="font-bold text-slate-800">Siti Rahma</p>
                                        <p class="text-slate-400 text-[11px]">Marketing & Broadcast</p>
                                    </div>
                                </div>
                                <span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded-md font-semibold text-[10px]">Hadir</span>
                            </div>
                            <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm text-xs">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center">AP</div>
                                    <div>
                                        <p class="font-bold text-slate-800">Andi Pratama</p>
                                        <p class="text-slate-400 text-[11px]">IT Support & Software</p>
                                    </div>
                                </div>
                                <span class="bg-amber-100 text-amber-700 px-2 py-1 rounded-md font-semibold text-[10px]">Cuti</span>
                            </div>
                            <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm text-xs">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center">BS</div>
                                    <div>
                                        <p class="font-bold text-slate-800">Budi Santoso</p>
                                        <p class="text-slate-400 text-[11px]">Staff Operasional & CRM</p>
                                    </div>
                                </div>
                                <span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded-md font-semibold text-[10px]">Hadir</span>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 3: PAYROLL (SLIP GAJI) -->
                    <div x-show="activeTab === 'payroll'" class="space-y-4" x-cloak>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Slip Gaji & Kompensasi</h3>
                        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-5 rounded-2xl shadow-md space-y-3">
                            <p class="text-xs text-blue-200 font-medium">Estimasi Gaji Bersih (Take Home Pay)</p>
                            <h2 class="text-2xl font-extrabold tracking-tight">Rp 5.450.000</h2>
                            <div class="flex justify-between text-[11px] text-blue-100 pt-2 border-t border-blue-600/50">
                                <span>Periode: Oktober 2026</span>
                                <span class="text-emerald-300 font-semibold">● Terverifikasi HR</span>
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm space-y-3 text-xs">
                            <h4 class="font-bold text-slate-700">Riwayat Slip Gaji</h4>
                            <div class="space-y-2">
                                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                                    <div>
                                        <p class="font-bold text-slate-800">September 2026</p>
                                        <p class="text-slate-400 text-[10px]">Dibayarkan (28 Sep 2026)</p>
                                    </div>
                                    <button @click="alert('Mengunduh dokumen PDF Slip Gaji...')" class="bg-blue-50 text-blue-600 font-bold px-3 py-1.5 rounded-lg text-[11px]">Unduh PDF</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 4: AKUN / PROFIL -->
                    <div x-show="activeTab === 'account'" class="space-y-4" x-cloak>
                        <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm text-center space-y-3">
                            <div class="w-16 h-16 rounded-full bg-blue-600 text-white font-extrabold text-xl flex items-center justify-center mx-auto shadow-md" x-text="currentUser.initial"></div>
                            <div>
                                <h3 class="font-bold text-slate-800 text-base" x-text="currentUser.name"></h3>
                                <p class="text-xs text-slate-400" x-text="currentUser.role"></p>
                            </div>
                            <span class="inline-block bg-blue-50 text-blue-700 text-[10px] font-bold px-3 py-1 rounded-full">Karyawan Tetap</span>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden text-xs divide-y divide-slate-100">
                            <div class="p-3.5 flex justify-between items-center hover:bg-slate-50 cursor-pointer" @click="alert('Fitur ubah kata sandi akun.')">
                                <span class="font-medium text-slate-700"><i class="fa-solid fa-lock text-blue-600 w-5"></i> Ubah Kata Sandi</span>
                                <i class="fa-solid fa-chevron-right text-slate-300"></i>
                            </div>
                            <div class="p-3.5 flex justify-between items-center hover:bg-slate-50 cursor-pointer" @click="alert('Pengaturan notifikasi aplikasi.')">
                                <span class="font-medium text-slate-700"><i class="fa-solid fa-bell text-blue-600 w-5"></i> Notifikasi</span>
                                <i class="fa-solid fa-chevron-right text-slate-300"></i>
                            </div>
                        </div>

                        <button @click="logout()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-3 rounded-2xl text-xs transition border border-rose-200">
                            Keluar dari Akun 🚪
                        </button>
                    </div>

                </main>

                <!-- NAVIGATION BAR -->
                <nav class="bg-white border-t border-slate-200 p-2 flex justify-around text-center text-xs text-slate-400 absolute bottom-0 w-full max-w-md shadow-lg">
                    <button @click="activeTab = 'home'" :class="activeTab === 'home' ? 'text-blue-600 font-bold' : 'hover:text-slate-600'" class="flex flex-col items-center gap-1 py-1 px-3">
                        <i class="fa-solid fa-house text-sm"></i> Beranda
                    </button>
                    <button @click="activeTab = 'team'" :class="activeTab === 'team' ? 'text-blue-600 font-bold' : 'hover:text-slate-600'" class="flex flex-col items-center gap-1 py-1 px-3">
                        <i class="fa-solid fa-users text-sm"></i> Tim
                    </button>
                    <button @click="activeTab = 'payroll'" :class="activeTab === 'payroll' ? 'text-blue-600 font-bold' : 'hover:text-slate-600'" class="flex flex-col items-center gap-1 py-1 px-3">
                        <i class="fa-solid fa-wallet text-sm"></i> Payroll
                    </button>
                    <button @click="activeTab = 'account'" :class="activeTab === 'account' ? 'text-blue-600 font-bold' : 'hover:text-slate-600'" class="flex flex-col items-center gap-1 py-1 px-3">
                        <i class="fa-solid fa-user-gear text-sm"></i> Akun
                    </button>
                </nav>

                <!-- MODAL FORM PENGAJUAN -->
                <div x-show="showModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
                    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                            <h3 class="font-bold text-sm text-slate-800" x-text="'Form Pengajuan ' + modalType.toUpperCase()"></h3>
                            <button @click="showModal = false" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                        </div>
                        
                        <div class="space-y-3 text-xs">
                            <div>
                                <label class="block text-slate-500 mb-1 font-medium">Tanggal Pelaksanaan</label>
                                <input type="date" x-model="formInput.date" class="w-full border border-slate-200 p-2.5 rounded-xl focus:outline-blue-600 bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-slate-500 mb-1 font-medium">Keterangan / Alasan</label>
                                <textarea x-model="formInput.reason" rows="3" placeholder="Tuliskan keterangan..." class="w-full border border-slate-200 p-2.5 rounded-xl focus:outline-blue-600 bg-slate-50"></textarea>
                            </div>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button @click="showModal = false" class="w-1/2 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-xs">Batal</button>
                            <button @click="submitRequest()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">Kirim</button>
                        </div>
                    </div>
                </div>

            </div>
        </template>

    </div>

    <!-- Script Logika -->
    <script>
        function enterpriseApp() {
            return {
                isLoggedIn: false,
                selectedRole: 'employee',
                activeTab: 'home',
                currentUser: { name: '', role: '', initial: '', type: 'employee' },
                currentDate: 'Minggu, 4 Okt 2026',
                locationStatus: 'Kantor Pusat (GPS Valid)',
                
                isClockedIn: false,
                isClockedOut: false,
                clockInTime: '',
                clockOutTime: '',
                attendanceStatus: 'Belum Clock-In',

                showModal: false,
                modalType: 'cuti',
                formInput: { date: '', reason: '' },

                adminStats: { hadir: 42, izin: 3, alpha: 0 },
                leaveRequests: [
                    { id: 1, name: 'Siti Rahma', type: 'Cuti Tahunan', date: '6-8 Okt 2026', reason: 'Urusan keluarga', status: 'Pending' },
                    { id: 2, name: 'Andi Pratama', type: 'Izin Sakit', date: '4 Okt 2026', reason: 'Demam tinggi', status: 'Pending' }
                ],

                login() {
                    this.isLoggedIn = true;
                    this.activeTab = 'home';
                    if (this.selectedRole === 'employee') {
                        this.currentUser = { name: 'Budi Santoso', role: 'Staff Operasional & CRM', initial: 'BS', type: 'employee' };
                    } else {
                        this.currentUser = { name: 'Sarah Manager', role: 'HR Operation Manager', initial: 'SM', type: 'admin' };
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                },

                clockIn() {
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.clockInTime = timeNow + ' WIB';
                    this.isClockedIn = true;
                    this.attendanceStatus = 'Hadir (Tepat Waktu)';
                    alert('📸 Absensi berhasil! GPS & Selfie terverifikasi.');
                },

                clockOut() {
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.clockOutTime = timeNow + ' WIB';
                    this.isClockedOut = true;
                    this.attendanceStatus = 'Selesai Jam Kerja';
                    alert('✅ Clock-Out berhasil dicatat.');
                },

                openModal(type) {
                    this.modalType = type;
                    this.formInput.date = '';
                    this.formInput.reason = '';
                    this.showModal = true;
                },

                submitRequest() {
                    if(!this.formInput.date || !this.formInput.reason) {
                        alert('Mohon lengkapi data pengajuan.');
                        return;
                    }
                    
                    this.leaveRequests.unshift({
                        id: Date.now(),
                        name: this.currentUser.name,
                        type: this.modalType.toUpperCase(),
                        date: this.formInput.date,
                        reason: this.formInput.reason,
                        status: 'Pending'
                    });

                    this.adminStats.izin += 1;
                    this.showModal = false;
                    alert('🎉 Pengajuan berhasil dikirim ke HR!');
                },

                approveReq(id) {
                    const req = this.leaveRequests.find(r => r.id === id);
                    if(req) req.status = 'Disetujui';
                },

                rejectReq(id) {
                    const req = this.leaveRequests.find(r => r.id === id);
                    if(req) req.status = 'Ditolak';
                }
            }
        }
    </script>
</body>
</html>
