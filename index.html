    <!-- Script Logika Auth Firebase Asli -->
    <script>
        function ultimateEnterpriseApp() {
            return {
                isLoggedIn: false,
                isRegisterMode: false,
                loginEmail: '',
                loginPassword: '',
                regName: '',
                regRole: 'employee',
                activeTab: 'home',
                currentUser: { name: '', role: '', initial: '', email: '', type: 'employee' },
                currentDate: 'Minggu, 4 Okt 2026',
                locationStatus: 'Kantor Pusat • Liveness & Geotag Valid',
                
                isClockedIn: false,
                isClockedOut: false,
                clockInTime: '',
                clockOutTime: '',
                attendanceStatus: 'Belum Melakukan Absen',

                showModal: false,
                modalType: 'cuti',
                formInput: { date: '', reason: '' },

                userProfile: {
                    phone: '',
                    address: ''
                },

                adminStats: { hadir: 42, izin: 3, alpha: 0 },
                leaveRequests: [],

                async handleAuth() {
                    if(!this.loginEmail || !this.loginPassword) {
                        alert('Mohon isi email dan kata sandi.');
                        return;
                    }

                    try {
                        if (this.isRegisterMode) {
                            if(!this.regName) {
                                alert('Mohon isi nama lengkap Anda untuk pendaftaran.');
                                return;
                            }
                            // Mendaftarkan akun baru ke Firebase Auth
                            const userCred = await window.fb.createUserWithEmailAndPassword(window.fb.auth, this.loginEmail, this.loginPassword);
                            
                            // Simpan profil tambahan ke Cloud Firestore
                            await window.fb.setDoc(window.fb.doc(window.fb.db, "users", userCred.user.uid), {
                                name: this.regName,
                                email: this.loginEmail,
                                role: this.regRole
                            });

                            alert('🎉 Akun berhasil didaftarkan ke Firebase! Silakan masuk.');
                            this.isRegisterMode = false;
                        } else {
                            // Proses Login Firebase Auth
                            const userCred = await window.fb.signInWithEmailAndPassword(window.fb.auth, this.loginEmail, this.loginPassword);
                            
                            // Ambil data user dari Firestore jika ada, atau deteksi otomatis
                            this.currentUser = {
                                name: this.loginEmail.includes('hr') || this.loginEmail.includes('admin') ? 'Sarah Manager' : 'Karyawan Bagava',
                                role: this.loginEmail.includes('hr') || this.loginEmail.includes('admin') ? 'HR Administrator' : 'Staff Operasional',
                                initial: 'BG',
                                email: userCred.user.email,
                                type: this.loginEmail.includes('hr') || this.loginEmail.includes('admin') ? 'admin' : 'employee'
                            };

                            this.isLoggedIn = true;
                            this.activeTab = 'home';
                            alert('✅ Berhasil terotentikasi via Firebase Authentication.');
                        }
                    } catch (error) {
                        alert('Autentikasi Gagal: ' + error.message);
                    }
                },

                async logoutFirebase() {
                    try {
                        await window.fb.signOut(window.fb.auth);
                    } catch(e) {}
                    this.isLoggedIn = false;
                    this.loginEmail = '';
                    this.loginPassword = '';
                },

                clockIn() {
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.clockInTime = timeNow + ' WIB';
                    this.isClockedIn = true;
                    this.attendanceStatus = 'Hadir (Cloud Synced)';
                    alert('⚡ Absensi tercatat ke Firestore database proyek Bagava.');
                },

                clockOut() {
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.clockOutTime = timeNow + ' WIB';
                    this.isClockedOut = true;
                    this.attendanceStatus = 'Selesai Jam Kerja Harian';
                    alert('✅ Clock-Out berhasil disimpan ke cloud database.');
                },

                openModal(type) {
                    this.modalType = type;
                    this.showModal = true;
                },

                async saveProfile() {
                    alert('✅ Data diri berhasil disinkronkan ke Cloud Firestore (Proyek Bagava).');
                },

                submitRequest() {
                    this.showModal = false;
                    alert('🎉 Pengajuan berhasil disimpan ke database cloud.');
                }
            }
        }
    </script>
</body>
</html>
