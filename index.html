<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentaLite Ultimate - Enterprise HRIS & Payroll System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 font-sans antialiased text-slate-100" x-data="ultimateApp()">

    <!-- App Container Wrapper (Navy Theme) -->
    <div class="max-w-md mx-auto min-h-screen bg-slate-900 shadow-2xl flex flex-col justify-between relative overflow-hidden border-x border-slate-800">
        
        <!-- ================= HALAMAN LOGIN ================= -->
        <template x-if="!isLoggedIn">
            <div class="p-8 flex-1 flex flex-col justify-center space-y-6 bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 text-white">
                <div class="text-center space-y-3">
                    <div class="w-16 h-16 bg-blue-600/20 rounded-2xl mx-auto flex items-center justify-center backdrop-blur-md text-2xl font-bold border border-blue-500/30 shadow-inner">
                        <i class="fa-solid fa-shield-halved text-blue-400"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-extrabold tracking-tight">TalentaLite Ultimate</h1>
                        <p class="text-xs text-slate-400 mt-1">Navy Corporate HRIS & Payroll Platform</p>
                    </div>
                </div>

                <div class="bg-slate-900/90 text-slate-100 p-6 rounded-3xl shadow-2xl space-y-4 border border-slate-800">
                    <div class="space-y-1">
                        <h2 class="text-sm font-bold text-slate-200">Autentikasi Sistem</h2>
                        <p class="text-[11px] text-slate-400">Pilih profil kredensial untuk masuk</p>
                    </div>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block text-slate-300 mb-1 font-semibold">Akun Pengguna</label>
                            <select x-model="selectedRole" class="w-full border border-slate-700 p-3 rounded-xl focus:outline-blue-500 bg-slate-800 font-medium text-slate-200">
                                <option value="employee">Budi Santoso (Staff Operasional & CRM)</option>
                                <option value="admin">Sarah Manager (HR & Payroll Administrator)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-300 mb-1 font-semibold">Keamanan Perangkat & Geotag</label>
                            <input type="password" value="••••••••••••" disabled class="w-full border border-slate-700 p-3 rounded-xl bg-slate-800 text-slate-50 font-mono">
                        </div>
                    </div>

                    <button @click="login()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition text-xs tracking-wide">
                        MASUK KE SISTEM 🚀
                    </button>
                </div>
            </div>
        </template>

        <!-- ================= HALAMAN UTAMA APLIKASI ================= -->
        <template x-if="isLoggedIn">
            <div class="flex flex-col flex-1 justify-between bg-slate-900">
                
                <!-- HEADER NAVY STYLE -->
                <header class="bg-slate-950 text-white p-5 rounded-b-[2rem] shadow-xl border-b border-slate-800">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-blue-600 text-white font-bold text-sm flex items-center justify-center shadow-md border border-blue-400/30" x-text="currentUser.initial"></div>
                            <div>
                                <h1 class="text-sm font-bold tracking-tight" x-text="currentUser.name"></h1>
                                <p class="text-[11px] text-slate-400 font-medium" x-text="currentUser.role"></p>
                            </div>
                        </div>
                        <button @click="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2 rounded-xl transition font-medium border border-slate-700">
                            Keluar <i class="fa-solid fa-arrow-right-from-bracket ml-1"></i>
                        </button>
                    </div>
                    <div class="mt-4 flex items-center justify-between text-xs bg-slate-900 p-2.5 rounded-xl border border-slate-800 text-slate-300">
                        <span><i class="fa-solid fa-location-dot text-blue-400 mr-1"></i> <span x-text="locationStatus"></span></span>
                        <span><i class="fa-regular fa-calendar text-blue-400 mr-1"></i> <span x-text="currentDate"></span></span>
                    </div>
                </header>

                <!-- KONTEN UTAMA BERDASARKAN TAB -->
                <main class="p-5 flex-1 overflow-y-auto pb-24 space-y-4">

                    <!-- TAB 1: BERANDA -->
                    <div x-show="activeTab === 'home'" class="space-y-4" x-cloak>
                        
                        <!-- VIEW KARYAWAN -->
                        <template x-if="currentUser.type === 'employee'">
                            <div class="space-y-4">
                                <!-- Status Kehadiran, Geotag & Face Auth -->
                                <div class="bg-slate-950 border border-slate-800 p-5 rounded-2xl shadow-lg text-center relative overflow-hidden">
                                    <div class="absolute top-0 right-0 bg-blue-900/50 text-blue-300 text-[10px] font-bold px-3 py-1 rounded-bl-xl border-l border-b border-blue-800">
                                        Anti Fake GPS & Lock Device Active 🔒
                                    </div>
                                    
                                    <p class="text-xs text-slate-400 font-bold tracking-wider uppercase mt-1">Status Kehadiran Hari Ini</p>
                                    
                                    <div class="my-3">
                                        <span class="text-lg font-extrabold" :class="isClockedIn ? 'text-emerald-400' : 'text-amber-400'" x-text="attendanceStatus"></span>
                                    </div>

                                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 mb-4 bg-slate-900 p-3 rounded-xl border border-slate-800">
                                        <div>
                                            <p class="text-slate-400 font-medium">Clock-In (Face Auth)</p>
                                            <p class="font-bold text-white text-sm" x-text="clockInTime || '--:--'"></p>
                                        </div>
                                        <div>
                                            <p class="text-slate-400 font-medium">Clock-Out</p>
                                            <p class="font-bold text-white text-sm" x-text="clockOutTime || '--:--'"></p>
                                        </div>
                                    </div>

                                    <template x-if="!isClockedIn">
                                        <button @click="clockIn()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-xs">
                                            <i class="fa-solid fa-face-recognition"></i> Face Auth & Clock-In Geotag
                                        </button>
                                    </template>
                                    <template x-if="isClockedIn && !isClockedOut">
                                        <button @click="clockOut()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-xs">
                                            <i class="fa-solid fa-person-walking-arrow-right"></i> Clock-Out Pulang Kantor
                                        </button>
                                    </template>
                                    <template x-if="isClockedIn && isClockedOut">
                                        <p class="text-xs text-blue-300 font-semibold bg-blue-950 py-2.5 rounded-lg border border-blue-900">✨ Kehadiran & Jam Kerja Selesai Terekam.</p>
                                    </template>
                                </div>

                                <!-- Modul Layanan Mandiri (Cuti, Sakit, Lembur, Reimburse) -->
                                <div>
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Layanan Mandiri Karyawan</h3>
                                    <div class="grid grid-cols-2 gap-2">
                                        <button @click="openModal('cuti')" class="p-3 bg-slate-950 border border-slate-800 hover:border-blue-500 rounded-xl text-left shadow-sm transition group">
                                            <i class="fa-solid fa-calendar-days text-blue-400 mb-1.5 text-sm"></i>
                                            <p class="font-bold text-xs text-slate-200">Permohonan Cuti</p>
                                            <p class="text-[10px] text-slate-400">Sisa kuota: 12 Hari</p>
                                        </button>
                                        <button @click="openModal('sakit')" class="p-3 bg-slate-950 border border-slate-800 hover:border-blue-500 rounded-xl text-left shadow-sm transition group">
                                            <i class="fa-solid fa-notes-medical text-rose-400 mb-1.5 text-sm"></i>
                                            <p class="font-bold text-xs text-slate-200">Izin & Sakit</p>
                                            <p class="text-[10px] text-slate-400">Lampirkan Surat Dokter</p>
                                        </button>
                                        <button @click="openModal('lembur')" class="p-3 bg-slate-950 border border-slate-800 hover:border-blue-500 rounded-xl text-left shadow-sm transition group">
                                            <i class="fa-solid fa-business-time text-amber-400 mb-1.5 text-sm"></i>
                                            <p class="font-bold text-xs text-slate-200">Jam Lembur</p>
                                            <p class="text-[10px] text-slate-400">Pengajuan & Approval</p>
                                        </button>
                                        <button @click="openModal('reimburse')" class="p-3 bg-slate-950 border border-slate-800 hover:border-blue-500 rounded-xl text-left shadow-sm transition group">
                                            <i class="fa-solid fa-receipt text-emerald-400 mb-1.5 text-sm"></i>
                                            <p class="font-bold text-xs text-slate-200">Reimburse</p>
                                            <p class="text-[10px] text-slate-400">Klaim pengeluaran</p>
                                        </button>
                                    </div>
                                </div>

                                <!-- Pengumuman Korporat -->
                                <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl shadow-sm space-y-2">
                                    <div class="flex items-center justify-between">
                                        <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Berita & Pengumuman</h4>
                                        <span class="text-[10px] bg-blue-950 text-blue-300 px-2 py-0.5 rounded font-bold border border-blue-900">Broadcast HR</span>
                                    </div>
                                    <div class="border-l-2 border-blue-500 pl-3 py-1 space-y-0.5">
                                        <p class="text-xs font-bold text-slate-200">Pemberlakuan Kalender Libur Nasional Q4</p>
                                        <p class="text-[11px] text-slate-400">Silakan cek menu kalender untuk jadwal libur operasional cabang.</p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- VIEW ADMIN / HR CONTROL DASHBOARD -->
                        <template x-if="currentUser.type === 'admin'">
                            <div class="space-y-4">
                                <div class="flex items-center justify-between">
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">HR & Payroll Control Center</h3>
                                    <button @click="alert('Mengunduh Laporan Kehadiran & Aktivitas Lengkap (.XLS)...')" class="text-[11px] bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg font-bold shadow-sm transition">
                                        <i class="fa-solid fa-file-excel mr-1"></i> Export Laporan
                                    </button>
                                </div>

                                <!-- Statistik Utama -->
                                <div class="grid grid-cols-3 gap-2 text-center">
                                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 shadow-sm">
                                        <p class="text-base font-extrabold text-blue-400" x-text="adminStats.hadir">0</p>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Hadir</p>
                                    </div>
                                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 shadow-sm">
                                        <p class="text-base font-extrabold text-amber-400" x-text="adminStats.izin">0</p>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Cuti/Izin</p>
                                    </div>
                                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 shadow-sm">
                                        <p class="text-base font-extrabold text-rose-400" x-text="adminStats.alpha">0</p>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Alpha</p>
                                    </div>
                                </div>

                                <!-- Kontrol HR: Multi Lokasi, Jabatan, Shift & Kalender -->
                                <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl shadow-sm space-y-3">
                                    <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Manajemen Instansi & Cabang</h4>
                                    <div class="grid grid-cols-2 gap-2 text-xs">
                                        <button @click="alert('Mengelola 3 Kantor Cabang aktif (Pusat, Cabang Utara, Cabang Selatan).')" class="p-2.5 bg-slate-900 border border-slate-800 hover:border-blue-500 rounded-xl text-left font-medium text-slate-300">
                                            🏢 Multi Lokasi (3 Cabang)
                                        </button>
                                        <button @click="alert('Mengelola Shift Kerja Fleksibel & Manajemen Jabatan.')" class="p-2.5 bg-slate-900 border border-slate-800 hover:border-blue-500 rounded-xl text-left font-medium text-slate-300">
                                            ⏰ Shift & Jabatan
                                        </button>
                                    </div>
                                </div>

                                <!-- Persetujuan Cuti / Lembur / Reimburse Pending -->
                                <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl shadow-sm space-y-3">
                                    <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Approval Mobile Apps Masuk</h4>
                                    <div class="space-y-2">
                                        <template x-for="req in leaveRequests" :key="req.id">
                                            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs flex justify-between items-center">
                                                <div class="space-y-0.5">
                                                    <p class="font-bold text-slate-200" x-text="req.name"></p>
                                                    <p class="text-slate-400 text-[11px]" x-text="req.type + ' (' + req.date + ')'"></p>
                                                    <p class="text-slate-500 italic text-[10px]" x-text="'Catatan: ' + req.reason"></p>
                                                </div>
                                                <div>
                                                    <template x-if="req.status === 'Pending'">
                                                        <div class="flex gap-1">
                                                            <button @click="approveReq(req.id)" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold">Setujui</button>
                                                            <button @click="rejectReq(req.id)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1.5 rounded-lg text-[10px] font-bold">Tolak</button>
                                                        </div>
                                                    </template>
                                                    <template x-if="req.status !== 'Pending'">
                                                        <span class="px-2.5 py-1 rounded-md text-[10px] font-bold" :class="req.status === 'Disetujui' ? 'bg-emerald-950 text-emerald-400 border border-emerald-900' : 'bg-rose-950 text-rose-400 border border-rose-900'" x-text="req.status"></span>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- TAB 2: TIM & AKTIVITAS -->
                    <div x-show="activeTab === 'team'" class="space-y-3" x-cloak>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Laporan Aktivitas & Data Karyawan</h3>
                        <div class="space-y-2">
                            <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between shadow-sm text-xs">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-blue-950 text-blue-400 font-bold flex items-center justify-center border border-blue-900">SR</div>
                                    <div>
                                        <p class="font-bold text-slate-200">Siti Rahma</p>
                                        <p class="text-slate-400 text-[11px]">Marketing & Broadcast • Cabang Pusat</p>
                                    </div>
                                </div>
                                <span class="bg-emerald-950 text-emerald-400 border border-emerald-900 px-2.5 py-1 rounded-md font-bold text-[10px]">Aktif</span>
                            </div>
                            <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between shadow-sm text-xs">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-slate-900 text-white font-bold flex items-center justify-center border border-slate-800">BS</div>
                                    <div>
                                        <p class="font-bold text-slate-200">Budi Santoso</p>
                                        <p class="text-slate-400 text-[11px]">Staff Operasional • Cabang Pusat</p>
                                    </div>
                                </div>
                                <span class="bg-emerald-950 text-emerald-400 border border-emerald-900 px-2.5 py-1 rounded-md font-bold text-[10px]">Aktif</span>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 3: PAYROLL OTOMATIS -->
                    <div x-show="activeTab === 'payroll'" class="space-y-4" x-cloak>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Payroll, BPJS & PPh 21</h3>
                        <div class="bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 text-white p-5 rounded-2xl shadow-lg space-y-3 border border-slate-800">
                            <p class="text-xs text-slate-300 font-medium">Hitung Otomatis Gaji Bersih (Take Home Pay)</p>
                            <h2 class="text-2xl font-extrabold tracking-tight">Rp 5.450.000</h2>
                            <div class="text-[11px] text-slate-300 pt-2 border-t border-slate-800 space-y-1">
                                <div class="flex justify-between"><span>Gaji Pokok & Tunjangan:</span> <span class="font-bold">Rp 6.000.000</span></div>
                                <div class="flex justify-between"><span>Potongan BPJS & PPh 21:</span> <span class="text-rose-400 font-bold">- Rp 550.000</span></div>
                            </div>
                        </div>

                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl shadow-sm space-y-3 text-xs">
                            <h4 class="font-bold text-slate-200">Komponen Slip Gaji Resmi</h4>
                            <div class="space-y-2">
                                <div class="flex justify-between items-center p-3 bg-slate-900 rounded-xl border border-slate-800">
                                    <div>
                                        <p class="font-bold text-slate-200">September 2026</p>
                                        <p class="text-slate-400 text-[10px]">Otomatis Termasuk Uang Lembur & Potongan Absensi</p>
                                    </div>
                                    <button @click="alert('Mengunduh Slip Gaji PDF Resmi...')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-lg text-[11px] transition">Unduh PDF</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 4: AKUN & KALENDER -->
                    <div x-show="activeTab === 'account'" class="space-y-4" x-cloak>
                        <div class="bg-slate-950 border border-slate-800 p-5 rounded-2xl shadow-sm text-center space-y-3">
                            <div class="w-16 h-16 rounded-full bg-blue-600 text-white font-extrabold text-xl flex items-center justify-center mx-auto shadow-md border border-blue-500" x-text="currentUser.initial"></div>
                            <div>
                                <h3 class="font-bold text-slate-100 text-base" x-text="currentUser.name"></h3>
                                <p class="text-xs text-slate-400" x-text="currentUser.role"></p>
                            </div>
                            <span class="inline-block bg-blue-950 text-blue-300 border border-blue-900 text-[10px] font-bold px-3 py-1 rounded-full">Kelengkapan Data Karyawan Lengkap</span>
                        </div>

                        <div class="bg-slate-950 border border-slate-800 rounded-2xl shadow-sm overflow-hidden text-xs divide-y divide-slate-800">
                            <div class="p-3.5 flex justify-between items-center hover:bg-slate-900 cursor-pointer transition" @click="alert('Kalender Hari Libur Nasional & Instansi aktif.')">
                                <span class="font-semibold text-slate-300"><i class="fa-solid fa-calendar-days text-blue-400 w-5"></i> Kalender Libur Nasional</span>
                                <i class="fa-solid fa-chevron-right text-slate-600"></i>
                            </div>
                            <div class="p-3.5 flex justify-between items-center hover:bg-slate-900 cursor-pointer transition" @click="alert('Pengaturan perangkat ter-lock otomatis.')">
                                <span class="font-semibold text-slate-300"><i class="fa-solid fa-mobile-screen-button text-blue-400 w-5"></i> Keamanan Perangkat (Lock Device)</span>
                                <i class="fa-solid fa-chevron-right text-slate-600"></i>
                            </div>
                        </div>

                        <button @click="logout()" class="w-full bg-rose-950/50 hover:bg-rose-900/50 text-rose-400 font-bold py-3 rounded-2xl text-xs transition border border-rose-900 shadow-sm">
                            Keluar dari Sesi <i class="fa-solid fa-arrow-right-from-bracket ml-1"></i>
                        </button>
                    </div>

                </main>

                <!-- NAVIGATION BAR (NAVY THEME) -->
                <nav class="bg-slate-950 border-t border-slate-800 p-2 flex justify-around text-center text-xs text-slate-400 absolute bottom-0 w-full max-w-md shadow-lg">
                    <button @click="activeTab = 'home'" :class="activeTab === 'home' ? 'text-blue-400 font-bold' : 'hover:text-slate-200'" class="flex flex-col items-center gap-1 py-1 px-3 transition">
                        <i class="fa-solid fa-house text-sm"></i> Beranda
                    </button>
                    <button @click="activeTab = 'team'" :class="activeTab === 'team' ? 'text-blue-400 font-bold' : 'hover:text-slate-200'" class="flex flex-col items-center gap-1 py-1 px-3 transition">
                        <i class="fa-solid fa-users text-sm"></i> Tim
                    </button>
                    <button @click="activeTab = 'payroll'" :class="activeTab === 'payroll' ? 'text-blue-400 font-bold' : 'hover:text-slate-200'" class="flex flex-col items-center gap-1 py-1 px-3 transition">
                        <i class="fa-solid fa-wallet text-sm"></i> Payroll
                    </button>
                    <button @click="activeTab = 'account'" :class="activeTab === 'account' ? 'text-blue-400 font-bold' : 'hover:text-slate-200'" class="flex flex-col items-center gap-1 py-1 px-3 transition">
                        <i class="fa-solid fa-user-gear text-sm"></i> Akun
                    </button>
                </nav>

                <!-- MODAL FORM PENGAJUAN -->
                <div x-show="showModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
                    <div class="bg-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4 border border-slate-800">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-sm text-slate-100" x-text="'Formulir ' + modalType.toUpperCase()"></h3>
                            <button @click="showModal = false" class="text-slate-400 hover:text-slate-200 font-bold">✕</button>
                        </div>
                        
                        <div class="space-y-3 text-xs">
                            <div>
                                <label class="block text-slate-300 mb-1 font-semibold">Tanggal / Periode</label>
                                <input type="date" x-model="formInput.date" class="w-full border border-slate-700 p-2.5 rounded-xl focus:outline-blue-500 bg-slate-800 font-medium text-slate-200">
                            </div>
                            <div>
                                <label class="block text-slate-300 mb-1 font-semibold">Keterangan / Nominal (Reimburse)</label>
                                <textarea x-model="formInput.reason" rows="3" placeholder="Tuliskan keterangan atau nominal klaim..." class="w-full border border-slate-700 p-2.5 rounded-xl focus:outline-blue-500 bg-slate-800 font-medium text-slate-200"></textarea>
                            </div>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button @click="showModal = false" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition">Batal</button>
                            <button @click="submitRequest()" class="w-1/2 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition">Kirim Pengajuan</button>
                        </div>
                    </div>
                </div>

            </div>
        </template>

    </div>

    <!-- Script Logika Ultimate -->
    <script>
        function ultimateApp() {
            return {
                isLoggedIn: false,
                selectedRole: 'employee',
                activeTab: 'home',
                currentUser: { name: '', role: '', initial: '', type: 'employee' },
                currentDate: 'Minggu, 4 Okt 2026',
                locationStatus: 'Kantor Pusat • Geotag Valid (Anti Fake GPS)',
                
                isClockedIn: false,
                isClockedOut: false,
                clockInTime: '',
                clockOutTime: '',
                attendanceStatus: 'Belum Melakukan Absen',

                showModal: false,
                modalType: 'cuti',
                formInput: { date: '', reason: '' },

                adminStats: { hadir: 42, izin: 3, alpha: 0 },
                leaveRequests: [
                    { id: 1, name: 'Siti Rahma', type: 'Permohonan Cuti', date: '6-8 Okt 2026', reason: 'Urusan keluarga di luar kota', status: 'Pending' },
                    { id: 2, name: 'Budi Santoso', type: 'Jam Lembur', date: '4 Okt 2026', reason: 'Maintenance Server & Broadcast Shopee', status: 'Pending' }
                ],

                login() {
                    this.isLoggedIn = true;
                    this.activeTab = 'home';
                    if (this.selectedRole === 'employee') {
                        this.currentUser = { name: 'Budi Santoso', role: 'Staff Operasional & CRM', initial: 'BS', type: 'employee' };
                    } else {
                        this.currentUser = { name: 'Sarah Manager', role: 'HR & Payroll Administrator', initial: 'SM', type: 'admin' };
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                },

                clockIn() {
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.clockInTime = timeNow + ' WIB';
                    this.isClockedIn = true;
                    this.attendanceStatus = 'Hadir (Face Auth & Geotag OK)';
                    alert('🔒 Keamanan Aktif: Face Authentication berhasil & Lokasi Geotag tervalidasi (Anti Fake GPS & Lock Device).');
                },

                clockOut() {
                    const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.clockOutTime = timeNow + ' WIB';
                    this.isClockedOut = true;
                    this.attendanceStatus = 'Selesai Jam Kerja Harian';
                    alert('✅ Clock-Out Berhasil: Rekapitulasi jam kerja & potongan absensi tercatat otomatis.');
                },

                openModal(type) {
                    this.modalType = type;
                    this.formInput.date = '';
                    this.formInput.reason = '';
                    this.showModal = true;
                },

                submitRequest() {
                    if(!this.formInput.date || !this.formInput.reason) {
                        alert('Mohon lengkapi seluruh formulir pengajuan.');
                        return;
                    }
                    this.leaveRequests.unshift({
                        id: Date.now(),
                        name: this.currentUser.name,
                        type: this.modalType.toUpperCase(),
                        date: this.formInput.date,
                        reason: this.formInput.reason,
                        status: 'Pending'
                    });
                    this.adminStats.izin += 1;
                    this.showModal = false;
                    alert('🎉 Pengajuan berhasil dikirim via Mobile Apps ke sistem HR.');
                },

                approveReq(id) {
                    const req = this.leaveRequests.find(r => r.id === id);
                    if(req) req.status = 'Disetujui';
                },

                rejectReq(id) {
                    const req = this.leaveRequests.find(r => r.id === id);
                    if(req) req.status = 'Ditolak';
                }
            }
        }
    </script>
</body>
</html>
